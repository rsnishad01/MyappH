name: Build Android Release Bundle & APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release Bundle (AAB) & APK
        run: |
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Release Artifacts (AAB & APK)
        uses: actions/upload-artifact@v4
        with:
          name: HundredGram-Release-Artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          retention-days: 14
