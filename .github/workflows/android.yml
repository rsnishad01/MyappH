name: Android CI/CD - Build HundredGram APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK file
        id: find_apk
        run: |
          mkdir -p outputs
          APK_PATH=$(find . -name "*.apk" -not -path "*/build-cache/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" outputs/HundredGram-debug.apk
            echo "apk_exists=true" >> $GITHUB_OUTPUT
          else
            echo "No APK found directly, checking fallback paths"
            if [ -f "HundredGram.apk" ]; then
              cp "HundredGram.apk" outputs/HundredGram-debug.apk
              echo "apk_exists=true" >> $GITHUB_OUTPUT
            else
              echo "apk_exists=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HundredGram-Debug-APK
          path: |
            outputs/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: outputs/HundredGram-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
